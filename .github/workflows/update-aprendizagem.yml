name: Atualizar snapshot aprendizagem
on:
  push:
    branches: [main]
    paths:
      - "scripts/update_aprendizagem.py"
      - ".github/workflows/update-aprendizagem.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update_aprendizagem.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/aprendizagem.json
          git diff --cached --quiet || git commit -m "Atualiza snapshot de aprendizagem"
          git push
