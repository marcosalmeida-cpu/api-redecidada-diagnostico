name: Atualizar Beneficios Sociais
on:
  schedule:
    - cron: "41 8 10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e agregar Novo Bolsa Familia e BPC
        run: python scripts/update_beneficios_sociais.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/beneficios_sociais.json
          git diff --cached --quiet || git commit -m "Atualiza snapshot de Bolsa Familia e BPC"
          git push
