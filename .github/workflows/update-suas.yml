name: Atualizar snapshot Censo SUAS
on:
  push:
    branches: [main]
    paths:
      - "scripts/update_suas.py"
      - ".github/workflows/update-suas.yml"
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: pip install pandas openpyxl xlrd
      - run: python scripts/update_suas.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/suas.json
          git diff --cached --quiet || git commit -m "Atualiza snapshot Censo SUAS"
          git push
